# Runs the tests on every push and pull request, on each Node version 2.x supports.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # keep testing the other versions if one fails
      matrix:
        node: [20, 22, 24, 26]
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
